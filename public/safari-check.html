<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>yHunter Safari Check</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        color: #24190e;
        background: #f7f2e8;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 28px 18px;
      }

      section {
        border: 1px solid rgba(79, 59, 37, 0.15);
        border-radius: 18px;
        background: rgba(255, 252, 246, 0.95);
        padding: 18px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      p {
        margin: 8px 0;
        line-height: 1.55;
      }

      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      pre {
        overflow: auto;
        white-space: pre-wrap;
        margin: 12px 0 0;
        border-radius: 12px;
        background: rgba(244, 239, 229, 0.72);
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>yHunter Safari Check</h1>
        <p>如果你能看到这一页，说明 Safari 能正常显示来自服务器的普通 HTML/CSS。</p>
        <p id="script-status">JavaScript: 未执行</p>
        <p id="fetch-status">API: 未测试</p>
        <pre id="details"></pre>
      </section>
    </main>
    <script>
      (function () {
        var scriptStatus = document.getElementById("script-status");
        var fetchStatus = document.getElementById("fetch-status");
        var details = document.getElementById("details");

        scriptStatus.textContent = "JavaScript: 已执行";
        details.textContent = "User-Agent: " + navigator.userAgent + "\nURL: " + location.href;

        fetch("/api/dashboard", { cache: "no-store" })
          .then(function (response) {
            fetchStatus.textContent = "API: HTTP " + response.status;
            return response.json();
          })
          .then(function (dashboard) {
            details.textContent +=
              "\nHoldings: " +
              (dashboard.holdings ? dashboard.holdings.length : "n/a") +
              "\nCandidates: " +
              (dashboard.candidates ? dashboard.candidates.length : "n/a");
          })
          .catch(function (error) {
            fetchStatus.textContent = "API: 失败";
            details.textContent += "\nError: " + (error && error.message ? error.message : String(error));
          });
      })();
    </script>
  </body>
</html>
